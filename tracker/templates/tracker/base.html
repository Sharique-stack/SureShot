<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sureshot | Govtdrish</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    
    <!-- Top Navigation Bar -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                
                <!-- Logo area -->
                <div class="flex items-center">
                    <span class="text-2xl font-black text-indigo-600 tracking-tight">
                        Sureshot<span class="text-gray-400 font-medium">.govtdrish</span>
                    </span>
                </div>
                
                <!-- User Profile & Logout -->
                <div class="flex items-center space-x-6">
                    <span class="text-sm font-medium text-gray-600 hidden md:block">
                        {{ request.user.get_full_name|default:request.user.username }}
                    </span>
                    <a href="/admin/logout/" class="text-sm font-bold text-red-500 hover:text-red-700 transition-colors">
                        Logout
                    </a>
                </div>
                
            </div>
        </div>
    </nav>

    <!-- Main Content Area where dashboard.html gets injected -->
    <main class="py-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            {% block content %}
            <!-- The content from dashboard.html will appear here -->
            {% endblock %}
        </div>
    </main>

</body>
</html>
