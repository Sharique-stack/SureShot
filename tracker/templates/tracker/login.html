<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sureshot by Govtdrish | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 flex items-center justify-center min-h-screen font-sans px-4">

    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 p-8 rounded-2xl shadow-2xl">
        <div class="text-center mb-8">
            <span class="text-xs font-bold tracking-widest text-amber-500 uppercase bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">Elite Mentorship Program</span>
            <h1 class="text-3xl font-extrabold mt-4 tracking-tight text-white">SURESHOT</h1>
            <p class="text-zinc-400 text-sm mt-2">Accountability & Compliance Control Engine</p>
        </div>

        {% if form.errors %}
            <div class="bg-red-500/10 border border-red-500/20 text-red-400 text-sm p-3 rounded-lg mb-4 text-center">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Aspirant ID / Username</label>
                <input type="text" name="username" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 focus:outline-none focus:border-amber-500 transition">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">Secure Passkey</label>
                <input type="password" name="password" required class="w-full bg-zinc-950 border border-zinc-800 rounded-xl px-4 py-3 text-zinc-100 focus:outline-none focus:border-amber-500 transition">
            </div>

            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-amber-500/20 tracking-wide mt-2">
                Authenticate & Enter Dashboard
            </button>
        </form>

        <p class="text-center text-xs text-zinc-500 mt-8">
            Protected by Sureshot Financial Security Protocols.
        </p>
    </div>

</body>
</html>
