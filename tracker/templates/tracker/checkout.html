<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sureshot | Secure Payment Gateway</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cashfree SDK -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans min-h-screen flex flex-col justify-center items-center">

    <div class="w-full max-w-md p-8">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black tracking-widest text-white mb-2">SURESHOT</h1>
            <p class="text-emerald-500 font-mono text-sm tracking-wide">SECURE CHECKOUT</p>
        </div>

        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Unlock the Command Tower</h2>
            <div class="flex justify-between items-center py-4 border-y border-zinc-800 mb-6">
                <span class="text-zinc-400">Refundable Deposit</span>
                <span class="text-2xl font-black text-white">₹40,000</span>
            </div>
            
            <p class="text-xs text-zinc-500 mb-6 leading-relaxed">
                By initiating this transaction, you agree to the Accountability Contract. 100% of this fee will be refunded if you maintain a Green Shield status through the duration of the program.
            </p>

            <button id="pay-btn" class="w-full bg-white text-black hover:bg-zinc-200 font-bold tracking-wide uppercase py-4 rounded-lg transition-all shadow-[0_0_15px_rgba(255,255,255,0.2)]">
                Initialize Secure Payment
            </button>
        </div>
    </div>

    <script>
        // Initialize Cashfree SDK based on environment
        const cashfree = Cashfree({
            mode: "{{ environment }}" 
        });

        document.getElementById("pay-btn").addEventListener("click", () => {
            let checkoutOptions = {
                paymentSessionId: "{{ payment_session_id }}",
                redirectTarget: "_self" // Opens modal on same page
            };
            
            // Launch Cashfree Checkout
            cashfree.checkout(checkoutOptions);
        });
    </script>
</body>
</html>
